<div class="voice-message-container d-flex align-items-center gap-2 p-2" [class.sent]="sender === 'me'"
    [class.received]="sender === 'them'">

    <button class="btn btn-sm rounded-circle play-btn d-flex justify-content-center align-items-center"
        (click)="togglePlay()" [disabled]="!isReady()">
        @if (isPlaying()) {
        <i class="bi bi-pause-fill fs-5"></i>
        } @else {
        <i class="bi bi-play-fill fs-5 ms-1"></i>
        }
    </button>

    <div class="waveform-box flex-grow-1" style="min-width: 150px; position: relative">
        <div #waveform></div>
        @if (!isReady()) {
        <div class="loading-overlay">
            <div class="spinner-border spinner-border-sm text-light"></div>
        </div>
        }
    </div>

    <div class="d-flex flex-column align-items-end gap-1 ms-1 controls">
        <span class="duration">{{ audioDuration || '0:00' }}</span>
        <div class="d-flex gap-1 actions">
            <button class="btn btn-sm p-0 speed-btn" (click)="toggleSpeed()">
                {{ playbackSpeed() }}x
            </button>
            <!-- Earpiece / Speaker toggle -->
            <button class="btn btn-sm p-0 earpiece-btn" (click)="toggleProximity()"
                [title]="isEarpiece() ? 'Earpiece' : 'Speaker'">
                <i class="bi" [class.bi-ear]="isEarpiece()" [class.bi-speaker]="!isEarpiece()"></i>
            </button>
        </div>
    </div>
</div>
