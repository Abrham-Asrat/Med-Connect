<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Med-Connect | Ethiopian Healthcare Platform</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    /* AI Floating Button */
    .ai-floating-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 9999;
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #078930, #056B24);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(7,137,48,0.4);
      transition: all 0.3s ease;
    }
    .ai-floating-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 28px rgba(7,137,48,0.5);
      background: linear-gradient(135deg, #056B24, #04521D);
    }
    .ai-floating-btn .tooltip-text {
      position: absolute;
      right: 70px;
      background: #1A1A1A;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .ai-floating-btn .tooltip-text::after {
      content: '';
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      border-left: 6px solid #1A1A1A;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
    }
    .ai-floating-btn:hover .tooltip-text {
      opacity: 1;
    }
    .ai-floating-btn .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(7,137,48,0.4);
      animation: pulse-ring 2s infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    /* AI Side Panel */
    .ai-panel-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 10000;
      display: none;
    }
    .ai-panel-overlay.open {
      display: block;
    }
    .ai-panel {
      position: fixed;
      top: 0;
      right: -420px;
      width: 400px;
      max-width: 90vw;
      height: 100%;
      background: white;
      z-index: 10001;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
      box-shadow: -4px 0 24px rgba(0,0,0,0.15);
    }
    .ai-panel.open {
      right: 0;
    }
    .ai-panel-header {
      background: linear-gradient(135deg, #078930, #056B24);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ai-panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .ai-panel-input {
      border-top: 1px solid #E5E7EB;
      padding: 12px 16px;
      display: flex;
      gap: 8px;
    }
    .ai-msg-user {
      background: #078930;
      color: white;
      padding: 10px 14px;
      border-radius: 16px 16px 4px 16px;
      max-width: 85%;
      margin-left: auto;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .ai-msg-bot {
      background: #F8F9FA;
      padding: 10px 14px;
      border-radius: 16px 16px 16px 4px;
      max-width: 85%;
      margin-bottom: 8px;
      font-size: 14px;
      border: 1px solid #E5E7EB;
    }
    .ai-quick-btn {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid #078930;
      background: white;
      color: #078930;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ai-quick-btn:hover {
      background: #078930;
      color: white;
    }
  </style>
</head>
<body>
  <app-root></app-root>

  <!-- AI Floating Button -->
  <button class="ai-floating-btn" onclick="toggleAIPanel()" title="AI Health Assistant">
    <span class="pulse-ring"></span>
    <span class="tooltip-text">🤖 AI Health Assistant</span>
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L2 7l10 5 10-5-10-5z"/>
      <path d="M2 17l10 5 10-5"/>
      <path d="M2 12l10 5 10-5"/>
    </svg>
  </button>

  <!-- AI Side Panel -->
  <div class="ai-panel-overlay" id="aiOverlay" onclick="toggleAIPanel()"></div>
  <div class="ai-panel" id="aiPanel">
    <!-- Header -->
    <div class="ai-panel-header">
      <div>
        <h6 class="mb-0">🤖 AI Health Assistant</h6>
        <small style="opacity:0.8">Powered by Med-Connect</small>
      </div>
      <button onclick="toggleAIPanel()" style="background:none;border:none;color:white;font-size:24px;cursor:pointer">&times;</button>
    </div>

    <!-- Messages -->
    <div class="ai-panel-body" id="aiMessages">
      <div class="ai-msg-bot">
        Hello! I'm your Med-Connect AI Health Assistant. I can help with general health questions, symptom information, and medication reminders. How can I help you today?
      </div>
      <div style="margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px;">
        <button class="ai-quick-btn" onclick="askAI('I have a headache')">🤕 Headache</button>
        <button class="ai-quick-btn" onclick="askAI('What is normal blood pressure?')">💓 Blood Pressure</button>
        <button class="ai-quick-btn" onclick="askAI('Set medication reminder')">💊 Reminder</button>
        <button class="ai-quick-btn" onclick="askAI('Health tip of the day')">💡 Health Tip</button>
      </div>
    </div>

    <!-- Input -->
    <div class="ai-panel-input">
      <input type="text" id="aiInput" placeholder="Ask a health question..." 
             style="flex:1;border:1px solid #E5E7EB;border-radius:8px;padding:10px 14px;font-size:14px;outline:none"
             onkeypress="if(event.key==='Enter')askAI(this.value)">
      <button onclick="askAI(document.getElementById('aiInput').value)" 
              style="background:#078930;color:white;border:none;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:700">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <!-- Cookie Consent -->
  <div id="cookie-banner" style="position: fixed; bottom: 0; left: 0; right: 0; z-index: 9998; 
            background: white; border-top: 3px solid #078930; padding: 12px 20px; 
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
    <span style="font-size: 14px; color: #6B7280;">
      🍪 We use cookies to enhance your experience.
    </span>
    <div style="display: flex; gap: 8px;">
      <button onclick="document.getElementById('cookie-banner').style.display='none'" 
              style="background: #078930; color: white; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-weight: 700;">
        Accept
      </button>
      <button onclick="document.getElementById('cookie-banner').style.display='none'" 
              style="background: transparent; color: #6B7280; border: none; cursor: pointer;">
        Reject
      </button>
    </div>
  </div>

  <script>
    // Toggle AI Panel
    function toggleAIPanel() {
      document.getElementById('aiOverlay').classList.toggle('open');
      document.getElementById('aiPanel').classList.toggle('open');
    }

    // AI Chat Function
    function askAI(question) {
      if (!question || !question.trim()) return;
      
      const messages = document.getElementById('aiMessages');
      const input = document.getElementById('aiInput');
      
      // Add user message
      messages.innerHTML += '<div class="ai-msg-user">' + question + '</div>';
      input.value = '';
      
      // AI thinking...
      const thinkingId = 'thinking-' + Date.now();
      messages.innerHTML += '<div id="' + thinkingId + '" class="ai-msg-bot" style="color:#6B7280"><em>Thinking...</em></div>';
      messages.scrollTop = messages.scrollHeight;

      // Simulate AI response
      setTimeout(function() {
        document.getElementById(thinkingId).remove();
        
        let response = '';
        const q = question.toLowerCase();
        
        if (q.includes('headache')) {
          response = 'Headaches can be caused by stress, dehydration, eye strain, or lack of sleep. 💧 Try drinking water, resting in a quiet dark room, or over-the-counter pain relievers. ⚠️ <b>Seek medical attention if:</b> headaches are severe, persistent, or accompanied by fever, stiff neck, or vision changes.';
        } else if (q.includes('blood pressure')) {
          response = '📊 <b>Normal blood pressure</b> is around <b>120/80 mmHg</b>. <br>• Elevated: 120-129/80<br>• High Stage 1: 130-139/80-89<br>• High Stage 2: 140+/90+<br><br>💡 Maintain healthy BP with exercise, low-sodium diet, and stress management.';
        } else if (q.includes('reminder')) {
          response = '💊 <b>Medication Reminder</b><br>I can help you remember to take your medications! Tell me:<br>• Medication name<br>• Dosage<br>• How often (daily, twice daily, weekly)<br>• What time of day';
        } else if (q.includes('tip')) {
          response = '🩺 <b>Health Tip of the Day:</b><br>Aim for <b>30 minutes of moderate exercise</b> 5 days a week. Walking, swimming, or cycling are great options! Also, drink <b>8 glasses of water</b> daily and get <b>7-8 hours of sleep</b>.';
        } else {
          response = 'Thank you for your question! 🤔 For specific medical concerns, I recommend consulting with a verified doctor on Med-Connect. Would you like me to help you <b>find a doctor</b> or <b>book an appointment</b>?';
        }

        messages.innerHTML += '<div class="ai-msg-bot">' + response + '</div>';
        messages.scrollTop = messages.scrollHeight;
      }, 1000);
    }
  </script>
</body>
</html>
