<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-icon"><i class="bi bi-heart-pulse-fill"></i></div>
      <h3 class="fw-bold text-dark mb-1">Med-Connect</h3>
      <p class="text-muted small mb-0">Welcome Back / እንኳን ደህና መጡ</p>
    </div>

    <div class="auth-body">
      @if (errorMessage()) {
      <div class="alert alert-danger px-3 py-2 mb-4 d-flex align-items-center gap-2 rounded-3 border-0">
        <i class="bi bi-exclamation-circle-fill"></i> <small>{{ errorMessage() }}</small>
      </div>
      }

      <div class="alert alert-info px-3 py-2 mb-4 d-flex align-items-center gap-2 rounded-3 border-0"
        style="background:#EEF5F0;color:#078930">
        <i class="bi bi-info-circle"></i> <small>Please verify your email before logging in. / እባክዎ ከመግባትዎ በፊት ኢሜልዎን
          ያረጋግጡ።</small>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <label class="form-label text-dark fw-bold small mb-2">Email Address / የኢሜል አድራሻ</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" formControlName="email" placeholder="you@example.com"
              [class.is-invalid]="hasError('email', 'required') || hasError('email', 'email')">
          </div>
        </div>

        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <label class="form-label text-dark fw-bold small mb-0">Password / የይለፍ ቃል</label>
            <a routerLink="/auth/forgot-password" class="text-decoration-none small text-primary"
              style="font-weight:600">Forgot? / ረሱ?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-lock"></i></span>
            <input [type]="showPassword()?'text':'password'" class="form-control" formControlName="password"
              placeholder="Enter password" [class.is-invalid]="hasError('password', 'required')">
            <button type="button" class="btn btn-light text-muted border-0" (click)="togglePassword()"><i
                [class]="showPassword()?'bi-eye-slash':'bi-eye'"></i></button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-2 mb-4 login-btn" [disabled]="isLoading()">
          @if(isLoading()){<span class="spinner-border spinner-border-sm me-2"></span>Authenticating... / እያረጋገጠ
          ነው...}@else{Sign In / ይግቡ}
        </button>

        <div class="text-center">
          <span class="text-muted small">Don't have an account? / መለያ የለዎትም?</span>
          <a routerLink="/auth/register" class="text-primary text-decoration-none fw-bold ms-1 small">Create Free
            Account / ነፃ መለያ ይፍጠሩ</a>
        </div>
      </form>
    </div>
  </div>
</div>
